name: Bug report
description: Report a reproducible defect
title: "bug: "
body:
  - type: textarea
    id: description
    attributes: {label: Description}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Rovecode and Bun versions}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Operating system and terminal}
