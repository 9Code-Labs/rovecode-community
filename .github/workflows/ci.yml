# Type-check and run the suite on every push and pull request. Bun's test runner, no services.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**.md"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: tsc
        run: bunx tsc --noEmit
      - name: tests
        run: bun test
        env:
          CI: "1"
